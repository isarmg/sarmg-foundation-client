format = 1
id = "desktop-agent"
kind = "agent"
formal_targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
http_adapters = []
web_profiles = []
required_capabilities = ["private-state", "bounded-spool", "https-delivery", "doctor"]
optional_capabilities = ["secret-envelope", "local-web-management"]

[policy.agent_limits]
max_record_bytes = 1048576
max_spool_bytes = 268435456
max_spool_entries = 4096

[policy.delivery]
batch_records = 32
max_backoff_seconds = 300
max_jitter_percent = 50
max_queue_failures = 100
