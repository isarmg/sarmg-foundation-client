[package]
name = "xcsc"
description = "Client-only common support: protected storage, lifecycle, portable logs, secrets, XML and mobile FFI"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
authors = ["sarmg <isarmg@163.com>"]
license = "Apache-2.0"
repository = "https://github.com/isarmg/xcsc"
homepage = "https://github.com/isarmg/xcsc"

[features]
default = []
mobile-ffi = []
jni = ["mobile-ffi", "dep:jni"]
tracing = ["dep:tracing", "dep:tracing-subscriber"]
offline-maintenance = ["dep:sqlx", "dep:libsqlite3-sys"]

[dependencies]
aes-gcm = "0.11.1"
hkdf = "0.13.0"
async-trait = "0.1"
futures-executor = "0.3"
getrandom = "0.4"
rand = "0.10.3"
quick-xml = "0.42.0"
roxmltree = "0.21.1"
rustix = { version = "1.1.5", features = ["fs", "process", "net", "event", "termios"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tempfile = "3"
thiserror = "2"
tokio = { version = "~1.53.2", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.27.0", features = ["v4", "serde"] }
zeroize = "1.9.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
jni = { version = "=0.22.4", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(target_os = "linux")'.dependencies]
sqlx = { version = "=0.9.0", default-features = false, features = ["sqlite-bundled"], optional = true }
libsqlite3-sys = { version = "=0.37.0", features = ["bundled"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
sha1 = "0.11"

[dev-dependencies]
jni = { version = "=0.22.4", features = ["invocation"] }
tokio = { version = "~1.53.2", features = ["test-util"] }

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
