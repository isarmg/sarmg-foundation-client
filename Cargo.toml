[workspace]
resolver = "3"
members = [
  "rust/crates/sarmg-client-cli",
  "rust/crates/sarmg-client-runtime",
  "rust/crates/sarmg-mobile-ffi",
  "rust/crates/sarmg-client-fs-safety",
  "rust/crates/sarmg-client-secret",
  "rust/crates/sarmg-client-secret-envelope",
  "rust/crates/sarmg-client-error",
  "rust/crates/sarmg-client-secure-http",
]

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.98"
authors = ["sarmg <isarmg@163.com>"]
license = "Apache-2.0"
repository = "https://github.com/isarmg/sarmg-foundation-client"
homepage = "https://github.com/isarmg/sarmg-foundation-client"

[workspace.dependencies]
aes-gcm = "0.10"
hkdf = "0.12"
async-trait = "0.1"
getrandom = "0.4"
libc = "0.2"
hickory-resolver = { version = "=0.26.2", default-features = false, features = ["tokio", "system-config"] }
ipnet = "2"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["http2"] }
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "signal", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
zeroize = "1.8"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
