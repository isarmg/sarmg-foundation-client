[workspace]
resolver = "3"
members = [
  "rust/crates/xcsc-cli",
  "rust/crates/xcsc-runtime",
  "rust/crates/xcsc-mobile-ffi",
  "rust/crates/xcsc-fs-safety",
  "rust/crates/xcsc-secret",
  "rust/crates/xcsc-secret-envelope",
  "rust/crates/xcsc-error",
  "rust/crates/xcsc-secure-xml",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
authors = ["sarmg <isarmg@163.com>"]
license = "Apache-2.0"
repository = "https://github.com/isarmg/xcsc"
homepage = "https://github.com/isarmg/xcsc"

[workspace.dependencies]
aes-gcm = "0.11.1"
hkdf = "0.13.0"
async-trait = "0.1"
futures-executor = "0.3"
getrandom = "0.4"
libc = "0.2.190"
rand = "0.10.3"
quick-xml = "0.42.0"
roxmltree = "0.21.1"
rustix = { version = "1.1.5", features = ["fs", "process", "net", "event", "termios"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
sha1 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "~1.53.2", features = ["fs", "macros", "rt-multi-thread", "signal", "sync", "time"] }
url = "2"
uuid = { version = "1.27.0", features = ["v4", "serde"] }
windows-sys = { version = "0.61", features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
zeroize = "1.9.1"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
