name: Client Foundation CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions: {}

jobs:
  apple-storage:
    permissions:
      contents: read
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.0 --profile minimal --component clippy
      - run: cargo test --locked -p sarmg-client-fs-safety -p sarmg-mobile-ffi --all-targets
      - run: cargo clippy --locked -p sarmg-client-fs-safety -p sarmg-mobile-ffi --all-targets -- -D warnings
      - run: bash scripts/test-apple-sandbox.sh
  windows-storage:
    permissions:
      contents: read
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy
      - name: Test native Windows directory handles and durable spool
        run: cargo test --locked -p sarmg-client-fs-safety -p sarmg-client-runtime --all-targets
      - name: Lint native Windows storage
        run: cargo clippy --locked -p sarmg-client-fs-safety -p sarmg-client-runtime --all-targets -- -D warnings
  client:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate client-only policy
        run: |
          python3 scripts/check-foundation.py
          python3 -m unittest discover -s tools/tests -v
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace --all-targets --all-features
      - name: Verify optimized transport admission and DNS shutdown
        run: |
          cargo test --locked --release -p sarmg-client-secure-http --lib -- --exact transport_tests::loopback_http_tracks_build_mode
          cargo test --locked --release -p sarmg-client-secure-http --lib dns::tests::
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
