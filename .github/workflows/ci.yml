name: Client xcsc CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      force_full:
        description: Run all validation when this workflow is reused
        type: boolean
        default: true

permissions: {}

jobs:
  # Keep PR workflows and existing check names present; filter jobs, not triggers.
  scope:
    name: Change scope
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_full: ${{ steps.changes.outputs.run_full }}
    steps:
      - name: Check out the comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select documentation or full validation
        id: changes
        shell: bash
        env:
          FORCE_FULL: ${{ inputs.force_full }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          run_full=true
          base=""
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" != tag ]]; then
            base="$PUSH_BASE"
          fi
          # Dispatches, release tags, new branches and unavailable history stay full.
          if [[ "$FORCE_FULL" != true && "$base" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git diff --name-only --no-renames -z "$base" HEAD > "$RUNNER_TEMP/changed-paths"
            run_full=false
            while IFS= read -r -d '' path; do
              case "$path" in
                # Release/package inputs and safety audits retain full validation.
                docs/releases/* | docs/unsafe*.md) run_full=true; break ;;
                README.md | docs/*.md) ;;
                *) run_full=true; break ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
          fi
          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"
          echo "Full validation: $run_full"

  mobile-compilation:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.run_full != 'false' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain and supported mobile targets
        run: rustup toolchain install 1.99.0 --profile minimal --target aarch64-linux-android,aarch64-apple-ios-sim
      - name: Compile all mobile-profile libraries against Android and iOS platform APIs
        run: |
          # The desktop service CLI (systemctl/launchctl/SCM) is outside the mobile profile.
          cargo check --locked -p xcsc --all-features --lib --target aarch64-linux-android
          cargo check --locked -p xcsc --all-features --lib --target aarch64-apple-ios-sim
  apple-storage:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.run_full != 'false' }}
    permissions:
      contents: read
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal --component clippy
      - name: Use the canonical OS temporary directory in no-follow path tests
        run: echo "TMPDIR=$(cd "$TMPDIR" && pwd -P)" >> "$GITHUB_ENV"
      - run: cargo test --locked -p xcsc --all-targets --all-features
      - run: cargo clippy --locked -p xcsc --all-targets --all-features -- -D warnings
      - run: bash scripts/test-apple-sandbox.sh
  windows-storage:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.run_full != 'false' }}
    permissions:
      contents: read
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy
      - name: Test native Windows ACLs, unprivileged access, directory handles, log rotation and durable spool
        run: cargo test --locked -p xcsc --all-targets --all-features
      - name: Lint native Windows storage
        run: cargo clippy --locked -p xcsc --all-targets --all-features -- -D warnings
  native-jni:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.run_full != 'false' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Install the fixed compatible real JVM
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17.0.20+101
          check-latest: false
      - name: Verify JNI frame, Unicode, byte budgets and exception boundaries on the real JVM
        run: cargo test --locked -p xcsc --features jni native_jvm_keeps_unicode_budgets_pending_exceptions_and_public_errors -- --ignored --nocapture
  client:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.run_full != 'false' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate client-only policy
        run: |
          python3 scripts/check-xcsc.py
          python3 -m unittest discover -s tools/tests -v
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p xcsc --all-targets --all-features
      - name: Verify readonly root inspection of service-owned spool
        run: |
          cargo test --locked -p xcsc --lib --all-features --no-run --message-format=json > "$RUNNER_TEMP/runtime-tests.json"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          artifacts = [json.loads(line) for line in (Path(os.environ['RUNNER_TEMP']) / 'runtime-tests.json').read_text().splitlines()]
          binaries = [item['executable'] for item in artifacts if item.get('reason') == 'compiler-artifact' and item.get('profile', {}).get('test') and item.get('target', {}).get('name') == 'xcsc' and item.get('executable')]
          assert len(binaries) == 1, 'expected one exact xcsc test binary'
          subprocess.run(['sudo', binaries[0], '--ignored', '--exact', 'runtime::spool::tests::administrative_inspection_reads_service_owned_spool_without_mutation'], check=True)
          PY
      - run: cargo clippy --locked -p xcsc --all-targets --all-features -- -D warnings
