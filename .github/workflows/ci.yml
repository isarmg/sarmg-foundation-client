name: Client Foundation CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions: {}

jobs:
  mobile-compilation:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain and supported mobile targets
        run: rustup toolchain install 1.99.0 --profile minimal --target aarch64-linux-android,aarch64-apple-ios-sim
      - name: Compile all mobile-profile libraries against Android and iOS platform APIs
        run: |
          # The desktop service CLI (systemctl/launchctl/SCM) is outside the mobile profile.
          cargo check --locked --workspace --exclude xcsc-cli --all-features --lib --target aarch64-linux-android
          cargo check --locked --workspace --exclude xcsc-cli --all-features --lib --target aarch64-apple-ios-sim
  apple-storage:
    permissions:
      contents: read
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal --component clippy
      - name: Use the canonical OS temporary directory in no-follow path tests
        run: echo "TMPDIR=$(cd "$TMPDIR" && pwd -P)" >> "$GITHUB_ENV"
      - run: cargo test --locked -p xcsc-cli -p xcsc-fs-safety -p xcsc-mobile-ffi -p xcsc-runtime --all-targets
      - run: cargo clippy --locked -p xcsc-cli -p xcsc-fs-safety -p xcsc-mobile-ffi -p xcsc-runtime --all-targets -- -D warnings
      - run: bash scripts/test-apple-sandbox.sh
  windows-storage:
    permissions:
      contents: read
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy
      - name: Test native Windows ACLs, unprivileged access, directory handles and durable spool
        run: cargo test --locked -p xcsc-cli -p xcsc-fs-safety -p xcsc-runtime --all-targets
      - name: Lint native Windows storage
        run: cargo clippy --locked -p xcsc-cli -p xcsc-fs-safety -p xcsc-runtime --all-targets -- -D warnings
  native-jni:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Install the fixed compatible real JVM
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17.0.20+101
          check-latest: false
      - name: Verify JNI frame, Unicode, byte budgets and exception boundaries on the real JVM
        run: cargo test --locked -p xcsc-mobile-ffi --features jni native_jvm_keeps_unicode_budgets_pending_exceptions_and_public_errors -- --ignored --nocapture
  client:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate client-only policy
        run: |
          python3 scripts/check-foundation.py
          python3 -m unittest discover -s tools/tests -v
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace --all-targets --all-features
      - name: Verify readonly root inspection of service-owned spool
        run: |
          cargo test --locked -p xcsc-runtime --lib --all-features --no-run --message-format=json > "$RUNNER_TEMP/runtime-tests.json"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          artifacts = [json.loads(line) for line in (Path(os.environ['RUNNER_TEMP']) / 'runtime-tests.json').read_text().splitlines()]
          binaries = [item['executable'] for item in artifacts if item.get('reason') == 'compiler-artifact' and item.get('profile', {}).get('test') and item.get('target', {}).get('name') == 'xcsc_runtime' and item.get('executable')]
          assert len(binaries) == 1, 'expected one exact runtime test binary'
          subprocess.run(['sudo', binaries[0], '--ignored', '--exact', 'spool::tests::administrative_inspection_reads_service_owned_spool_without_mutation'], check=True)
          PY
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
